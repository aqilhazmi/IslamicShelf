<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Islamic Shelf - Login</title>
    <link href="styleloginpage.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="left-section">
            <div class="logo">
                <div class="logo-icon" style="background: white; color: #0F4D2C; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 8px;">IS</div>
                <div class="logo-text">ISLAMIC SHELF</div>
            </div>
            <div class="hero-text">
                UNLOCK THE<br>
                WORLD OF ISLAMIC<br>
                TEACHINGS
            </div>
        </div>
        <div class="right-section">
            <nav class="nav-links">
                <a href="#login">LOGIN</a>
                <a href="#signup">SIGNUP</a>
                
            </nav>
            <div class="login-form">
                <div class="form-group">
                    <label>Username/email address</label>
                    <input type="text" placeholder="youraddress@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="••••••••">
                </div>
                <button class="login-btn">LOGIN</button>
                <div class="social-login">
                    <button class="social-btn">
                        <i class="fab fa-facebook-f"></i>
                        Facebook
                    </button>
                    <button class="social-btn">
                        <i class="fab fa-google"></i>
                        Google
                    </button>
                </div>
                <div class="footer">
                    Don't have an account? <a href="#signup">Sign Up</a>
                </div>
            </div>
        </div>
    </div>
    <div class="share">
        <i class="fas fa-book"></i>
    </div>

</body>
</html>
